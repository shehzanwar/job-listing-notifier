    - "android developer"
    - "embedded"
    - "firmware"
    - "hardware engineer"
    - "rf engineer"
    - "network engineer"
    - "cybersecurity analyst"   # Unless data-focused
    - "soc analyst"
    - "penetration tester"
    - "mechanical engineer"
    - "electrical engineer"
    - "civil engineer"
    - "nurse"
    - "attorney"
    - "accountant"
    - "hr "
