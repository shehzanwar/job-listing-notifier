exclude_titles:
  seniority:
    - "senior"
    - "sr."
    - "sr "
    - "principal"
    - "staff"
    - "lead"
    - "director"
    - "vp"
    - "vice president"
    - "chief"
    - "head of"
    - "architect"
    - "fellow"
    - "distinguished"
    - "executive"
    - "manager"       # Unless "associate" or "assistant" also present
    - "supervisor"
  unrelated_roles:
    - "software engineer"
    - "backend"
    - "full-stack"
    - "fullstack"
    - "devops"
    - "sre"
    - "site reliability"
    - "frontend"
    - "front-end"
