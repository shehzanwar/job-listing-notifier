  # ── Phenom People (SPA — needs Playwright, deferred to Phase 2) ─
  - name: "MITRE"
    ats: phenom
    career_url: "https://careers.mitre.org"
    search_url: "https://careers.mitre.org/us/en/search-results"
    dejobs_url: "https://mitre.dejobs.org/jobs/"   # DirectEmployers feed, possible interim source
    priority: 1                                     # highest personal priority once scraper exists
    phase: 2
    notes: >
      Migrated off Workday to Phenom People. The Workday tenant
      (mitre.wd5.myworkdayjobs.com/MITRE) still resolves but returns 0
      postings. careers.mitre.org is a JS SPA (cdn.phenompeople.com,
      data-ph-* templates) — plain HTTP GETs return unrendered template
      variables, and the Phenom API needs a browser session, so this
      requires a Playwright-based scraper. Confirmed 218 jobs live via
      rendered page: Data Science and Analytics (6), Operations Research
      (4), Artificial Intelligence (20), Computer Science (5). Clearance
      facet: None (81), Secret (57), Top Secret (27), TS/SCI (15),
      TS/SCI/Polygraph (34) — 81 jobs need no clearance at all.
